name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files)"
          if printf '%s\n' "$tracked" | grep -Eq '(^|/)(\.omo|\.opencode|\.codegraph)(/|$)|(^|/)\.env$|(^|/)cookies\.txt$|\.cookies\.txt$|^(data|media)/'; then
            echo "Forbidden local credential/runtime state is tracked:" >&2
            printf '%s\n' "$tracked" | grep -E '(^|/)(\.omo|\.opencode|\.codegraph)(/|$)|(^|/)\.env$|(^|/)cookies\.txt$|\.cookies\.txt$|^(data|media)/' >&2
            exit 1
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q app tests
      - name: Validate compose
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Whitespace check
        run: git diff --check
